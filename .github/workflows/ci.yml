name: ci

on:
  pull_request:
  push:
    branches: [main]

# Pull requests—including forks—receive only a read token. This workflow has no
# secrets, write permissions, deployment environment, or privileged trigger.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the required Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set the required npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run required root validation
        run: npm run validate
