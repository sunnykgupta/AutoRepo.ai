name: clean-room

on:
  pull_request:
  push:
    branches: [main]

# The scan processes only the submitted checkout. It receives no secrets and no
# write token, so it is safe to execute for pull requests from forks.
permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Enforce the public-boundary credential and file-shape scan
        run: node .github/scripts/scan-clean-room.mjs
