name: governance

on:
  pull_request:
  push:

# This required check always runs, including for fork pull requests. It has no
# secrets and no write permissions.
permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the required Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set the required npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify generated ownership
        run: node .github/scripts/generate-codeowners.mjs --check
      - name: Verify GitHub baseline policy
        run: node .github/scripts/validate-github-baseline.mjs
      - name: Run GitHub policy unit tests
        run: node --test .github/scripts/generate-codeowners.test.mjs .github/scripts/scan-clean-room.test.mjs .github/scripts/validate-github-baseline.test.mjs
