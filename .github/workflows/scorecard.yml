name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '59 4 * * 1'

# Scorecard only evaluates trusted main/scheduled revisions. It is deliberately
# absent from pull_request so untrusted code never receives upload permissions.
permissions:
  contents: read

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Check out the trusted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard and upload trusted results
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Preserve the Scorecard SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Publish Scorecard findings to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
