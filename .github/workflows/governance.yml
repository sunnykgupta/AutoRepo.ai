name: governance

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

# This required check always runs, including for fork pull requests. It has no
# secrets and no write permissions.
permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Set the required npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify generated ownership
        run: node .github/scripts/generate-codeowners.mjs --check
      - name: Verify GitHub baseline policy
        run: node .github/scripts/validate-github-baseline.mjs
      - name: Run GitHub policy unit tests
        run: node --test .github/scripts/generate-codeowners.test.mjs .github/scripts/scan-clean-room.test.mjs .github/scripts/validate-github-baseline.test.mjs
  coordination:
    name: coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Set the required npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate canonical coordination and generated projections
        run: npm run validate:governance:git
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: Validate fake integration boundaries
        run: npm run validate:integrations
      - name: Run coordination regression tests
        run: npm run test:governance
