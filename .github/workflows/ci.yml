name: ci

on:
  pull_request:
  push:
    branches: [main]

# Pull requests—including forks—receive only a read token. This workflow has no
# secrets, write permissions, deployment environment, or privileged trigger.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Set the required npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run required root validation
        run: npm run validate
