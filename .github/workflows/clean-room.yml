name: clean-room

on:
  pull_request:
  push:
    branches: [main]

# The scan processes only the submitted checkout. It receives no secrets and no
# write token, so it is safe to execute for pull requests from forks.
permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Enforce the public-boundary credential and file-shape scan
        run: node .github/scripts/scan-clean-room.mjs
